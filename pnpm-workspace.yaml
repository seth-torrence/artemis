packages:
  - 'packages/*'
  - 'apps/*'

# pnpm blocks dependency lifecycle scripts by default. These need theirs:
# esbuild fetches its platform binary, electron fetches the Electron runtime,
# electron-winstaller builds Windows installer bits, and node-pty resolves its
# native binding — a prebuild where one exists for the platform, a `node-gyp`
# compile where one does not (which is every Linux, including CI's).
#
# Note what this does *not* buy: node-pty's `post-install.js` never marks the
# prebuilt `spawn-helper` executable, so the bit arrives unset and the first
# spawn fails with `posix_spawnp failed`. That is repaired at runtime instead —
# see `ensureHelperExecutable` in `apps/desktop/main/terminal.ts`.
allowBuilds:
  electron: true
  esbuild: true
  electron-winstaller: true
  node-pty: true

# A dependency has to have sat on the registry for a day before an install
# here will resolve to it. Compromised versions of popular packages are
# usually spotted and yanked within hours of publication; a 24-hour quarantine
# means a resolution in this repo never races that yank. It costs nothing in
# CI — frozen-lockfile installs resolve no versions at all — and only delays
# the moment a person deliberately updating a dependency sees its newest
# release.
minimumReleaseAge: 1440 # minutes: one day

# tsx was taken same-day, before the gate above existed. The exclusion is
# pinned to that exact version, so it stops matching — and the quarantine
# starts applying — on the next tsx bump, which is the intended expiry.
#
# The Agent SDK is here for a different reason, and it is a trade made with
# open eyes. Artemis's model list is whatever the bundled CLI reports, so a
# model that ships in an SDK release does not exist in this app until the
# dependency moves — Opus 5.5 is in 0.3.280 and in nothing before it. Waiting
# out the quarantine means a day where the app cannot offer a model the user's
# account already has, and the picker showing an out-of-date lineup is the
# failure people actually hit.
#
# Same pinning as tsx, and the same expiry: every entry names one exact
# version, the platform binaries included, so the quarantine applies in full to
# the next SDK bump. If that bump is not urgent, it should simply wait the day.
minimumReleaseAgeExclude:
  - tsx@4.23.12
  - '@anthropic-ai/claude-agent-sdk@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-darwin-arm64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-darwin-x64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-linux-arm64-musl@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-linux-x64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-linux-x64-musl@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-win32-arm64@0.3.280'
  - '@anthropic-ai/claude-agent-sdk-win32-x64@0.3.280'

# One zod for every host, pinned rather than ranged.
#
# `pnpm deploy --legacy --config.node-linker=hoisted` — how the server image is
# built — re-resolves instead of honouring the lockfile, so a `^4.4.3` range
# there fetched 4.6.5 while every developer machine ran 4.4.3. Under 4.6.5 the
# Agent SDK's in-process tool server cannot convert its tools' schemas when a
# client lists them, and the served container answered every run with
# "artemisMemory is not available". The exact dependency in `packages/core` is
# what fixes the build; this is the belt to that pair of braces, and it lives
# here because pnpm 11 stopped reading `pnpm.overrides` from package.json.
overrides:
  zod: 4.4.3
