# Cut a release: push a v* tag (scripts/release.ts does the gating and the
# push) and this builds every platform natively, boot-verifies each build, and
# publishes one GitHub release with all artifacts and the per-arch update
# feeds the in-app updater reads.
#
# Each target builds on its own architecture's runner on purpose: the Claude
# Agent SDK ships per-platform binaries as optional dependencies and pnpm only
# installs the host's, so a native runner per target is what guarantees every
# artifact contains the binary it needs.
#
# There is deliberately no mac x64 target. Nobody in the company runs an
# Intel Mac, and the build cost real minutes on GitHub's slower Intel image
# every release. An existing Intel install polls `latest-mac-x64.yml`, finds
# no feed, and simply stops being offered updates — quiet, not broken. If an
# Intel machine ever matters again, restore the matrix entry from the
# v1.10.0 tag of this file (runner was `macos-15-intel`, available through
# August 2027).

name: Release

on:
  push:
    tags: ['v*']
  # Build and boot-verify every platform without cutting a release. This is how
  # you find out that a runner image or a cross-platform assumption broke
  # *before* a tag is riding on it — the publish job below only runs for tags.
  workflow_dispatch:

# Read-only by default. The gate and build jobs run third-party actions, and
# an action running with a token that can write to the repository is a supply
# chain the repository does not need to be part of — only `publish` writes,
# and only it gets the scope.
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The default shallow checkout is one commit deep — just the tagged
          # commit, with none of the history that connects it to main. The
          # ancestry check below needs that history to exist locally, so fetch
          # all of it; this repository is small enough that "all" is cheap.
          fetch-depth: 0
      # A tag is a claim: that this commit is version X, and that it went out
      # through main. Both halves have failed silently before either is
      # checked here — a tag pushed with a stale package.json publishes an app
      # that reports the wrong version to its own updater, and a tag on an
      # unmerged commit publishes work that review never saw.
      - if: startsWith(github.ref, 'refs/tags/v')
        name: The tag names the packaged version, and sits on main
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(jq -r .version apps/desktop/package.json)"
          if [ "$tagged" != "$packaged" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tagged, but apps/desktop/package.json says $packaged — retag the commit that actually carries this version."
            exit 1
          fi
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::the tagged commit $(git rev-parse --short HEAD) is not on origin/main — releases ship only what main has merged."
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  build:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        # Each entry must run on a runner that *is* its target. Cross-building
        # from one arch to another packages cleanly and produces a broken app:
        # electron-builder swaps in the target's Electron but keeps whichever
        # Agent SDK binary pnpm installed for the host, so an Intel bundle
        # built on Apple Silicon ships an arm64 `claude` that an Intel Mac
        # cannot exec at all.
        include:
          - name: macos-arm64
            runs-on: macos-latest
            build-args: --mac --arm64
            feed-rename: latest-mac-arm64.yml
            app-binary: apps/desktop/release/mac-arm64/Artemis.app/Contents/MacOS/Artemis
          - name: windows-x64
            runs-on: windows-latest
            build-args: --win --x64
            feed-rename: ''
            app-binary: apps/desktop/release/win-unpacked/Artemis.exe
          - name: linux-x64
            # Every Linux target `electron-builder.yml` declares, which for a
            # long time was not what this job built: the config asked for
            # AppImage, deb and pacman and the argument here said `pacman`, so
            # two of the three were declared, never built, and never published.
            # Anyone not on Arch was told to build from source for no reason.
            #
            # No target list here on purpose. `--linux` builds what the config
            # declares, so the two cannot drift apart again — adding a format is
            # an edit to the config alone.
            #
            # x64 on a Linux x64 runner because the bundled native dependencies
            # are the architecture they are built on: the Agent SDK ships
            # per-platform binaries as optional dependencies and pnpm installs
            # only the host's.
            runs-on: ubuntu-latest
            build-args: --linux --x64
            feed-rename: ''
            app-binary: apps/desktop/release/linux-unpacked/artemis
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # electron-builder's pacman target asks bsdtar to generate .MTREE.
      # ubuntu-latest does not ship it; libarchive-tools is the Ubuntu package
      # that provides it. Install it only for the Linux matrix entry, before
      # packaging has spent time assembling an artifact it cannot finish.
      #
      # The other two Linux formats need nothing installed here: electron-builder
      # fetches fpm for the deb itself, and reads the maintainer and homepage it
      # requires from `apps/desktop/package.json`'s `author` and `homepage`
      # (fpm fails the build outright without a maintainer). The AppImage
      # runtime is likewise downloaded rather than packaged.
      - if: runner.os == 'Linux'
        name: Install Arch package tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools
      - run: pnpm run build
      - run: pnpm --filter @rx-artemis/desktop exec electron-builder ${{ matrix.build-args }} --publish never
      # The terminal UI, as one self-contained tarball for this runner's
      # platform — see scripts/package-tui.ts. Not on Windows: the TUI has
      # never been run there, and install.sh is a bash script.
      - if: runner.os != 'Windows'
        name: Package the terminal UI
        run: pnpm exec tsx scripts/package-tui.ts
      # The feed the Arch updater reads. electron-builder's own names the
      # AppImage; Artemis installs the .pacman. See scripts/linux-update-feed.ts.
      - if: runner.os == 'Linux'
        name: Write the Arch update feed
        run: pnpm exec tsx scripts/linux-update-feed.ts
      # One feed per mac architecture. electron-builder always writes
      # `latest-mac.yml`; the updater asks for `latest-mac-<arch>.yml`, so a
      # machine can only ever be offered its own architecture's artifact.
      - if: matrix.feed-rename != ''
        shell: bash
        run: mv apps/desktop/release/latest-mac.yml apps/desktop/release/${{ matrix.feed-rename }}
      # The packaged app must actually boot before anything is published.
      - shell: bash
        run: |
          if [ "${{ runner.os }}" = Linux ]; then
            # linux-unpacked is not installed, so chrome-sandbox cannot yet be
            # root-owned with mode 4755 as it is after package installation.
            # Disable only that Chromium layer for this ephemeral boot check.
            xvfb-run -a pnpm exec tsx scripts/verify-package.ts "${{ matrix.app-binary }}" --no-sandbox
          else
            pnpm exec tsx scripts/verify-package.ts "${{ matrix.app-binary }}"
          fi
      # The check above boots `linux-unpacked`, the directory electron-builder
      # assembled — which proves the app and says nothing about what the
      # packages made of it. This boots what actually ships.
      #
      # The AppImage is the format worth spending a minute on: it is the only
      # one of the three that is its own executable, and its payload has been
      # through a squashfs round trip that the deb and the pacman package have
      # not. That round trip is where a file mode goes missing, which is the
      # exact class of defect `verify-package.ts` exists for — Artemis 0.6.1
      # booted perfectly and could not open a terminal.
      #
      # `--appimage-extract` rather than running the AppImage in place: the
      # runner has no FUSE for one to mount itself with, and the extracted tree
      # is laid out exactly as `verify-package.ts` expects (a binary with
      # `resources/` beside it), so the same script and the same flags do the
      # job with nothing special-cased.
      - if: runner.os == 'Linux'
        name: The AppImage ships a working app
        shell: bash
        working-directory: apps/desktop/release
        run: |
          appimage="$(ls ./*.AppImage)"
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
          cd "$GITHUB_WORKSPACE"
          xvfb-run -a pnpm exec tsx scripts/verify-package.ts \
            apps/desktop/release/squashfs-root/artemis --no-sandbox
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          # Only what someone or something consumes: dmg for people on macOS,
          # AppImage, deb and pacman for people on Linux, zip for the mac
          # updater's swap and setup.exe for the Windows one, and the feed each
          # updater reads — latest-mac-*.yml renamed above, latest.yml straight
          # from the Windows build.
          #
          # Blockmaps are electron-updater's differential-download index, which
          # our updater never reads. electron-builder's own `latest-linux.yml`
          # is still left behind — it names the AppImage, which nothing here
          # installs — while `latest-linux-pacman.yml`, written above, names
          # the package the Arch updater actually asks pacman for.
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.pacman
            apps/desktop/release/latest-mac-*.yml
            apps/desktop/release/latest.yml
            apps/desktop/release/latest-linux-pacman.yml
            apps/desktop/release/artemis-tui-*.tar.gz

  publish:
    needs: build
    # Tags publish; manual dispatch runs stop after the build matrix has proved
    # every platform still packages and boots.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The one place the workflow writes: `gh release create` needs it. Scoped
    # here so the build matrix above — the jobs that run third-party actions —
    # never holds a token that could touch the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # A tag carrying a semver prerelease part — v1.0.0-beta.1 — is published
      # as a prerelease, and that is not cosmetic. GitHub's
      # `/releases/latest` endpoint skips prereleases, and that endpoint is
      # exactly what the updater asks for on the stable channel, so the flag is
      # the only thing standing between a beta build and every installed copy
      # of the app offering it. Without it a beta tag ships to everyone.
      # The release is assembled as a draft and published only once every
      # artifact is up. `gh release create <tag> dist/*` did both at once, and
      # that is two problems. Uploads to uploads.github.com fail — a 400 on a
      # 200MB asset with nothing wrong with the file, which is what sank
      # v1.14.1 — and gh does not retry them, so one flake costs a whole
      # release. Worse, the release is live from the moment it is created: had
      # the upload died after `latest-mac-arm64.yml` landed but before the zip
      # it names, every installed copy of the app would have been offered an
      # update it could not download. A draft is invisible to users and to the
      # `/releases/latest` endpoint the updater reads, so neither half can be
      # observed until all of it is there.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-*) prerelease="--prerelease" ;;
            *)   prerelease="" ;;
          esac

          # Publishing a release with no artifacts is worse than failing: it
          # looks shipped and offers nothing.
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::dist/ is empty — the build artifacts never arrived."
            exit 1
          fi

          # A re-run of this job finds the draft its failed attempt left
          # behind. Reuse it — the uploads below clobber, so a re-run finishes
          # a partial draft instead of starting the whole upload again.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # shellcheck disable=SC2086
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "Artemis $version" \
              --notes-file .github/RELEASE_NOTES.md \
              $prerelease
          fi

          # One asset at a time: a retry then costs the file that failed
          # rather than all 700MB of them.
          # Files, wherever the artifact put them: a directory here is not an
          # asset, and uploading one fails the whole release.
          for asset in $(find dist -type f | sort); do
            for attempt in 1 2 3; do
              if gh release upload "$GITHUB_REF_NAME" "$asset" --clobber; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::$(basename "$asset") failed to upload after 3 attempts."
                exit 1
              fi
              echo "$(basename "$asset") failed to upload; retrying in $((attempt * 20))s"
              sleep $((attempt * 20))
            done
          done

          # Everything is up: the release becomes visible, atomically.
          gh release edit "$GITHUB_REF_NAME" --draft=false
