<!doctype html>
<!--
  `class="dark"` is the fallback, not the answer. `index.css` declares
  `@custom-variant dark` against this class and defines the dark palette on
  `:root`, so a document that never runs a line of script still renders exactly
  the app Artemis shipped as dark-only. The boot script further down replaces
  it with the palette the user actually chose, before the first paint.

  Keeping the attribute is what makes that script's failure survivable: if it is
  ever blocked — a CSP whose hash has drifted is the realistic way — the app
  comes up dark and correct rather than unstyled, and the store's own pass at
  module load still corrects it a moment later.

  One rule governs everything above the real head element, this comment
  included: do not write the opening or closing head or body tag out, not even
  inside backticks. Vite chooses where to inject by running a plain regular
  expression over this file's raw text — first thing that looks like the tag
  wins, comments and all — so a tag named in prose swallows whatever belongs
  at that point. Named here, it swallows the dev client and the React Fast
  Refresh preamble: neither runs, every component module then throws
  "@vitejs/plugin-react can't detect preamble", and `pnpm dev` opens a blank
  window. A packaged build is unaffected, because its stylesheet and script
  tags are injected before the closing tag instead, and that is what makes this
  a trap rather than a typo — the release looks right while every contributor's
  dev server is dead. `index-html-injection.test.ts` fails if it drifts back.
-->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content-Security-Policy for the renderer. No remote code, no eval, no
      remote fonts. Vite's dev server injects its own client over the same
      origin, which `'self'` covers.

      This is a *second* policy, not the only one: `applySessionPolicy` sets a
      stricter CSP header on every response, and this meta tag is the fallback
      that survives a failure of that pass. Both are enforced, and — this is the
      part that is easy to get wrong — they are enforced **independently**. A
      request must satisfy every policy that applies to the document, so the
      effective permission is the *intersection* of the two. A directive the
      header grants is still blocked if this tag does not also grant it, and the
      only evidence is a `ERR_BLOCKED_BY_CSP` in a console nobody has open.

      `frame-src` is exactly that trap, and it is the reason the preview pane
      once rendered every HTML and SVG artifact as a blank white rectangle.
      `frame-src` was absent here, so it fell back to `default-src 'self'`, and a
      `artemis-preview:` frame is not `'self'` — the frame was refused before
      `preview.ts`'s handler was ever asked for the bytes. Markdown was
      unaffected and looked fine, because markdown is rendered in place by
      `PreviewPane` and never goes near a frame; that asymmetry is what made it
      look like a problem with HTML rather than with this line.

      So: the scheme is spelled out below, and it must stay in step with
      `PREVIEW_SCHEME` in `main/preview.ts`. An HTML file cannot import the
      constant, which is the whole reason these two can drift.

      `connect-src` carries `http: https:`, and that breadth is this layer's
      honest limit rather than a loosened posture. Remote mode (ADR 0004)
      fetches one user-configured origin, and a static tag cannot name a value
      chosen at runtime — the *narrowing to exactly that origin* is done twice
      elsewhere, by the header CSP `applySessionPolicy` computes per response
      and by the `webRequest` lockdown, both of which read the configured
      origin live and grant no wildcard ever. This tag already worked that
      way: `ws://localhost:*` below has never been in the production header,
      which narrows it away. The cost, stated plainly: if BOTH runtime layers
      failed at once, this fallback alone would no longer stop a compromised
      renderer's fetch — connect-src only; script, frames and everything else
      stay as tight as ever.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-yRY6nRklLH9xjg6E1SchWH7UfjpaDTMnCFAe/HvBO/o='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://localhost:* http: https:; frame-src artemis-preview:"
    />
    <!--
      Resolve the palette before anything paints.

      This is deliberately inline, deliberately parser-blocking, and
      deliberately *not* the module bundle. The store applies the same class at
      module load (see `applyTheme` in `state/store.ts`), but `<script
      type="module">` is deferred: it runs after the document is parsed, which
      is after the stylesheet is ready and therefore potentially after Chromium
      has painted a frame. Electron shows the window on `ready-to-show`, which
      fires on that first paint — so "a frame or two of the wrong palette" is
      precisely the frame the user is shown. A user who chose light on a
      dark-mode machine would see a dark flash on every single launch, and they
      are the exact person this feature is for.

      It sits *after* the meta CSP on purpose: a policy delivered by meta only
      governs what follows it, so putting the script above would exempt it from
      the very policy this file exists to enforce. Both policies cover it, and
      both name its hash — `'sha256-…'` in the meta tag above and in
      `PRODUCTION_CSP` in `main/security.ts`. `renderer-csp.test.ts` recomputes
      that hash from this script's bytes and asserts both copies still match, so
      editing a character here fails a test rather than silently disabling the
      script in packaged builds only.

      The development header does NOT carry the hash, and must not: under CSP
      level 3 a hash in `script-src` causes `'unsafe-inline'` to be ignored, and
      dev needs `'unsafe-inline'` for Vite's Fast Refresh preamble. Dev is
      covered because the meta tag is stripped by `stripDevCspMeta` and the dev
      header still allows inline script.

      The key must stay equal to `PREFS_KEY` in `state/store.ts`, and the
      no-`matchMedia` fallback must stay equal to `prefersDark`'s. An HTML
      document cannot import either; the same test asserts both.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme = 'system';
        try {
          var raw = localStorage.getItem('artemis.prefs.v1');
          var stored = raw ? JSON.parse(raw).theme : null;
          if (stored === 'light' || stored === 'dark' || stored === 'system') theme = stored;
        } catch (error) {
          /* An unreadable blob is not worth a failed launch. Fall through. */
        }
        var dark =
          theme === 'system'
            ? !window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches
            : theme === 'dark';
        root.classList.toggle('dark', dark);
        root.classList.toggle('light', !dark);
      })();
    </script>
    <title>Artemis</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
